services:
  gateway:
    build: ./app
    image: prana/adw300-gateway:latest
    container_name: adw300-gateway
    ports:
      - "8000:8000"          # interface web: http://localhost:8000
    environment:
      - CONFIG_FILE=/config.yml
    volumes:
      - ./config.yml:/config.yml:ro
      - ./certificates:/certificates:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para a ponte serial rodando no Windows
    restart: unless-stopped
