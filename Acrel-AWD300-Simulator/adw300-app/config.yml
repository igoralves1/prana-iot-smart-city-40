# ============================================================================
#  CONFIGURACAO DO APP ADW300 (setup + teste) <-> AWS IoT Core
#  Edite SOMENTE as linhas marcadas com  <-- EDITE.  Salve e reinicie.
# ============================================================================

# -------- O que o app deve fazer --------
mode: simulator          # <-- EDITE: "simulator" (teste sem medidor) ou "meter" (le o ADW300 real)
publish_to_aws: true     # o app publica leituras no AWS IoT Core? (true/false)
subscribe_from_aws: true # o app assina o topico e MOSTRA os dados recebidos do AWS? (true/false)
poll_interval: 5         # intervalo de leitura/publicacao, em segundos

# -------- Ligacao com o medidor (so vale no modo "meter") --------
transport: tcp           # NAO altere para uso com Docker (tcp = via ponte serial)
serial_port: COM3        # <-- EDITE: porta COM do conversor USB-RS485 (Gerenciador de Dispositivos)
baud_rate: 9600          # <-- EDITE se necessario (padrao de fabrica 9600; alguns 1200)
parity: N
stopbits: 1
slave_id: 1              # <-- EDITE: endereco Modbus do medidor (de fabrica = 1)
bridge_host: host.docker.internal
bridge_port: 5020

# -------- Identidade do medidor no payload --------
device_id: "20201998111433"   # <-- EDITE: codigo de barras de 14 digitos do medidor
iccid: ""

# -------- Identidade do LAPTOP / web-app (certificados Web-Certs) --------
#  O app usa esta identidade para PUBLICAR e ASSINAR no AWS IoT Core.
#  O client_id e DIFERENTE do medidor, para os dois conviverem em paralelo.
aws:
  endpoint: a13bm01k8tg2b8-ats.iot.us-east-1.amazonaws.com
  port: 8883
  client_id: Kurc-Building-WebApp          # identidade do app (nao use a mesma do medidor)
  publish_topic: Kurc-Building-Central      # <-- onde o app publica (teste)
  subscribe_topic: Kurc-Building-Central    # <-- o que o app recebe e mostra (dados reais do medidor)
  ca_file: certificates/AmazonRootCA1.pem
  cert_file: certificates/Web-Certs-certificate.pem.crt
  key_file: certificates/Web-Certs-private.pem.key

# -------- Identidade do MEDIDOR ADW300 (certificados ADW300-Certs) --------
#  Estes certificados sao os que vao DENTRO do medidor (importados como .bin
#  no software ACREL). Sao a identidade do ADW300 ao conectar direto pela 4G.
adw300:
  client_id: Kurc-Building-Central
  topic: Kurc-Building-Central
  ca_file: certificates/AmazonRootCA1.pem
  cert_file: certificates/ADW300-Certs-certificate.pem.crt
  key_file: certificates/ADW300-Certs-private.pem.key

web_port: 8000
